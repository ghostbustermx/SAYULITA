services:
  php-api:
    build:
      context: .
      dockerfile: Dockerfile.php
    expose:
      - "80"
    networks:
      - app-network

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PROXY_URL=http://php-api
    depends_on:
      - php-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
